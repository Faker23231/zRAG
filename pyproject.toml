[project]
name = "kb-0716"
version = "0.1.0"
description = "zRAG — 从 PDF 到带引用答案的检索增强生成工作台"
authors = [
    { name = "ly", email = "ly1526@163.com" }
]
requires-python = ">=3.12"
dependencies = [
    "colorlog>=6.12.0",
    "fastapi>=0.142.4",
    "grandalf>=0.8",
    "langchain>=1.4.3",
    "langchain-openai>=1.6.7",
    "langchain-text-splitters>=1.1.3",
    "langgraph>=1.2.14",
    "minio>=7.2.20",
    "numpy>=2.5.3",
    "pymongo>=4.18.2",
    "python-dotenv>=1.2.4",
    "torch>=2.11.0",
    "torchvision>=0.26.0",
    "torchaudio>=2.11.0",
    "flagembedding>=1.3.5",
    "transformers>=4.45.0,<5.0.0",
    "modelscope>=1.40.2",
    "pymilvus[model]>=3.0.2",
    "openai-agents>=0.24.0",
    "mcp==1.29",
    "dashscope>=1.27.8",
]

[project.scripts]
kb-0716 = "kb_0716:main"
zrag = "zzk.web.app:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"


[tool.uv.sources]
# 强制从 NVIDIA 源安装
torch = { index = "pytorch-cuda" }
torchvision = { index = "pytorch-cuda" }
torchaudio = { index = "pytorch-cuda" }

# 本机：RTX 5080 (Blackwell / sm_120) + 驱动 616.92 (CUDA UMD 13.4)
# sm_120 需 CUDA >= 12.8；cu128 线在 Windows 已停更于 torch 2.11.0，故用 cu130
[[tool.uv.index]]
name = "pytorch-cuda"
url = "https://download.pytorch.org/whl/cu130"
explicit = true
