<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
    <h1>SSE案例01</h1>
    <button id="btn">发请求给后端制造邮件</button>
    <div id="content">

    </div>

    <script>
        const btn = document.getElementById('btn')
        btn.onclick = async function (e) {
            const res = await fetch('http://localhost:8000/sse01?session_id=123')
            const data = await res.json()
            console.log(data)
            //订阅sse

        //     订阅sse请求建立长连接
            es = new EventSource('http://localhost:8000/handlesse01?session_id=123')
        //     前端要接收流式响应推送的数据，那么就得做事件监听
            es.onmessage = function (e) {
                console.log(e.data)
                // document.getElementById('content').innerHTML += e.data + '<br/>'
                // const divObj = document.getElementById('content')
                // divObj.innerHTML = divObj.innerHTML + e.data + '<br/>'

                if(e.data !== "None") {
                    const divObj = document.getElementById('content')
                    divObj.innerHTML = divObj.innerHTML + e.data + '<br/>'
                }else{
                    es.close() //关闭连接
                }


            }

        }

    </script>
</body>
</html>
